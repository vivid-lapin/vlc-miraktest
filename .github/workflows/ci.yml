name: CI

on:
  push:
    branches:
      - master
  pull_request:
    paths-ignore:
      - .gitignore
      - LICENSE
      - "**.md"

env:
  VLC_HASH: dfbec325520e36c83775c74120fdb3e5e38f35f6
  LIBARIBCAPTION_HASH: 0a3a209d3f0b3650b92941248b9701bf69584a1f # 1.1.1
jobs:
  build-macos:
    strategy:
      matrix:
        target:
          - x86_64
          - aarch64
        include:
          - target: x86_64
            os: macos-latest
          - target: aarch64
            os: macos-latest
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: "videolan/vlc"
          ref: ${{ env.VLC_HASH }}
      - uses: actions/checkout@v4
        with:
          path: vlc-build
      - uses: actions/checkout@v4
        with:
          repository: "xqq/libaribcaption"
          ref: ${{ env.LIBARIBCAPTION_HASH }}
          path: libaribcaption
      - name: Install libaribcaption
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j8
          sudo cmake --install . --prefix /usr/local
        working-directory: libaribcaption
      - name: Prepare
        run: |
          brew install coreutils
          echo "PATH=$(brew --prefix coreutils)/libexec/gnubin:$PATH" >> "$GITHUB_ENV"
          git apply vlc-build/patches/*.patch
          mkdir -p build
      - name: Prepare (aarch64)
        if: matrix.target == 'aarch64'
        run: |
          git apply vlc-build/patches/arm64/*.patch
      - name: Build
        run: |
          which msgmerge
          which sha512sum
          sha512sum --version
          export MACOSX_DEPLOYMENT_TARGET=15.4
          ../extras/package/macosx/build.sh -c -i n -a ${{ matrix.target }}
        working-directory: ./build
      - name: Check
        run: ls -la
        working-directory: ./build
      - name: Pack build artifact
        run: zip -rq build.zip ./build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-${{ matrix.target }}
          path: build.zip
      - name: Upload libaribsub artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-aribsub-dylib-${{ matrix.target }}
          path: build/vlc_install_dir/lib/vlc/plugins/codec/libaribsub_plugin.dylib
      - name: Upload libts artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-ts-dylib-${{ matrix.target }}
          path: build/vlc_install_dir/lib/vlc/plugins/demux/libts_plugin.dylib
      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-image-${{ matrix.target }}
          path: build/*.dmg

  build-windows:
    runs-on: ubuntu-latest

    if: ${{ false }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: "videolan/vlc"
          ref: ${{ env.VLC_HASH }}
      - uses: actions/checkout@v4
        with:
          path: vlc-build
      - name: Install build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 mingw-w64-tools \
            lua5.2 libtool automake autoconf autopoint make gettext pkg-config \
            wine64-development-tools libwine-dev \
            gperf
          sudo ln -sf /usr/include/wine/wine/* /usr/include/wine
      - name: Prepare
        run: |
          git apply vlc-build/patches/*.patch
          mkdir -p build
      - name: Build
        run: |
          ../extras/package/win32/build.sh -z
        working-directory: ./build
      - name: Packaging
        run: |
          make package-win32-zip
        working-directory: ./build/win64
      - name: Check
        run: ls -la
        working-directory: ./build/win64
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            build/win64/vlc-3.*/*.txt
            build/win64/vlc-3.*/libvlc.dll
            build/win64/vlc-3.*/libvlccore.dll
            build/win64/vlc-3.*/plugins
